title: An example Pipestat output schema
description: objects produced by PEPATAC pipeline.
type: object
properties:
  pipeline_name: PEPATAC
  samples:
    type: array
    items:
      type: object
      properties:
        # These are declared as file objects rather than plain strings so the
        # report renders them as links. Reporting them as strings is not
        # workable while looper drives pipestat from a config file: pipestat
        # then runs with validate_results=False and silently rewrites any
        # string ending in .bed/.bam into {path, title}, so the six would
        # render inconsistently (see report_file_link in pipelines/pepatac.py).
        smooth_bw:
          type: object
          object_type: file
          description: "Smoothed signal track"
          properties:
            path:
              type: string
            title:
              type: string
          required:
            - path
            - title
        exact_bw:
          type: object
          object_type: file
          description: "Nucleotide-resolution signal track"
          properties:
            path:
              type: string
            title:
              type: string
          required:
            - path
            - title
        aligned_bam:
          type: object
          object_type: file
          description: "Coordinate sorted deduplicated, aligned BAM file"
          properties:
            path:
              type: string
            title:
              type: string
          required:
            - path
            - title
        peak_file:
          type: object
          object_type: file
          description: "Sample peak file"
          properties:
            path:
              type: string
            title:
              type: string
          required:
            - path
            - title
        coverage_file:
          type: object
          object_type: file
          description: "Sample peak coverage table"
          properties:
            path:
              type: string
            title:
              type: string
          required:
            - path
            - title
        summits_bed:
          type: object
          object_type: file
          description: "Peak summit file"
          properties:
            path:
              type: string
            title:
              type: string
          required:
            - path
            - title
        File_mb:
          type: number
          description: "size of file"
        Read_type:
          type: string
          description: "read_type"
        Genome:
          type: string
          description: "e.g. hg38"
        Raw_reads:
          type: string
          description: "raw reads"
        Fastq_reads:
          type: number
          description: "fastq_reads"
        Trimmed_reads:
          type: number
          description: "trimmed_reads"
        Trim_loss_rate:
          type: number
          description: "trimmed loss rate"
        FastQC report r1:
          title: "FastQC report r1"
          description: "FastQC report r1"
          type: object
          object_type: file
          properties:
            path:
              type: string
            thumbnail_path:
              # FastQC outputs an HTML report with no thumbnail. pipestat
              # always synthesizes the field in the reported dict but as
              # None when there's no thumbnail, so the schema has to accept
              # null too. (Without this, newer pipestat raises
              # SchemaValidationErrorDuringReport: None is not of type
              # 'string' from check_trim().)
              type:
                - string
                - "null"
            title:
              type: string
          required:
            - path
            - title
        FastQC report r2:
          title: "FastQC report r2"
          description: "FastQC report r2"
          type: object
          object_type: file
          properties:
            path:
              type: string
            thumbnail_path:
              # See note on FastQC report r1.
              type:
                - string
                - "null"
            title:
              type: string
          required:
            - path
            - title
        Aligned_reads_rCRSd:
          type: number
          description: "Aligned_reads_rCRSd"
        Alignment_rate_rCRSd:
          type: number
          description: "Alignment_rate_rCRSd"
        Mapped_reads:
          type: string
          description: "mapped_reads"
        QC_filtered_reads:
          type: number
          description: "QC_filtered_reads"
        Aligned_reads:
          type: string
          description: "Aligned_reads"
        Alignment_rate:
          type: number
          description: "Alignment_rate"
        Total_efficiency:
          type: number
          description: "Total_efficiency"
        Mitochondrial_reads:
          type: number
          description: "Mitochondrial_reads"
        NRF:
          type: number
          description: "NRF"
        PBC1:
          type: number
          description: "PBC1"
        PBC2:
          type: number
          description: "PBC1"
        Unmapped_reads:
          type: number
          description: "Unmapped_reads"
        Duplicate_reads:
          type: number
          description: "Duplicate_reads"
        Dedup_aligned_reads:
          type: number
          description: "Dedup_aligned_reads"
        Dedup_alignment_rate:
          type: number
          description: "Dedup_alignment_rate"
        Dedup_total_efficiency:
          type: number
          description: "Dedup_total_efficiency"
        NFR_frac:
          type: number
          description: "NFR_frac"
        mono_frac:
          type: number
          description: "mono_frac"
        di_frac:
          type: number
          description: "di_frac"
        tri_frac:
          type: number
          description: "tri_frac"
        poly_frac:
          type: number
          description: "poly_frac"
        Read_length:
          type: number
          description: "Read_length"
        Genome_size:
          type: number
          description: "Read_length"
        Frac_exp_unique_at_10M:
          type: number
          description: "Frac_exp_unique_at_10M"
        TSS_score:
          type: number
          description: "TSS_score"
        Fragment distribution:
          title: "Fragment distribution"
          description: "Fragment distribution"
          type: object
          object_type: image
          properties:
            path:
              type: string
            thumbnail_path:
              type: string
            title:
              type: string
          required:
            - path
            - thumbnail_path
            - title
        Peak_count:
          type: number
          description: "Peak_count"
        FRiP:
          type: number
          description: "FRiP"
        Peak chromosome distribution:
          title: "Peak chromosome distribution"
          description: "Peak chromosome distribution"
          type: object
          object_type: image
          properties:
            path:
              type: string
            thumbnail_path:
              type: string
            title:
              type: string
          required:
            - path
            - thumbnail_path
            - title
        TSS distance distribution:
          title: "TSS distance distribution"
          description: "TSS distance distribution"
          type: object
          object_type: image
          properties:
            path:
              type: string
            thumbnail_path:
              type: string
            title:
              type: string
          required:
            - path
            - thumbnail_path
            - title
        Peak partition distribution:
          title: "Peak partition distribution"
          description: "Peak partition distribution"
          type: object
          object_type: image
          properties:
            path:
              type: string
            thumbnail_path:
              type: string
            title:
              type: string
          required:
            - path
            - thumbnail_path
            - title
        cFRiF:
          title: "cFRiF"
          description: "cFRiF"
          type: object
          object_type: image
          properties:
            path:
              type: string
            thumbnail_path:
              type: string
            title:
              type: string
          required:
            - path
            - thumbnail_path
            - title
        FRiF:
          title: "FRiF"
          description: "FRiF"
          type: object
          object_type: image
          properties:
            path:
              type: string
            thumbnail_path:
              type: string
            title:
              type: string
          required:
            - path
            - thumbnail_path
            - title
        Picard_est_lib_size:
          type: number
          description: "Picard estimated library size"
        FRiP_ref:
          type: number
          description: "FRiP using reference peaks"
        Library complexity:
          title: "Library complexity"
          description: "Library complexity curve"
          type: object
          object_type: image
          properties:
            path:
              type: string
            thumbnail_path:
              type: string
            title:
              type: string
          required:
            - path
            - thumbnail_path
            - title
        TSS enrichment:
          title: "TSS enrichment"
          description: "TSS enrichment plot"
          type: object
          object_type: image
          properties:
            path:
              type: string
            thumbnail_path:
              type: string
            title:
              type: string
          required:
            - path
            - thumbnail_path
            - title
        Motif analysis:
          title: "Motif analysis"
          description: "Motif enrichment analysis results"
          type: object
          object_type: file
          properties:
            path:
              type: string
            title:
              type: string
            thumbnail_path:
              type: string
          required:
            - path
            - title
        Time:
          type: string
          description: "time"
        Success:
          type: string
          description: "success"
  project:
    type: object
    properties:
      alignment_percent_file:
        title: "Alignment percent file"
        description: "Plots percent of total alignment to all pre-alignments and primary genome."
        type: object
        object_type: image
        properties:
          path:
            type: string
          thumbnail_path:
            type: string
          title:
            type: string
        required:
          - path
          - thumbnail_path
          - title
      alignment_raw_file:
        title: "Alignment raw file"
        description: "Plots raw alignment rates to all pre-alignments and primary genome."
        type: object
        object_type: image
        properties:
          path:
            type: string
          thumbnail_path:
            type: string
          title:
            type: string
        required:
          - path
          - thumbnail_path
          - title
      TSS_enrichment:
        title: "TSS enrichment file"
        description: "Plots TSS scores for each sample."
        type: object
        object_type: image
        properties:
          path:
            type: string
          thumbnail_path:
            type: string
          title:
            type: string
        required:
          - path
          - thumbnail_path
          - title
      Library_complexity:
        title: "Library complexity file"
        description: "Plots each sample's library complexity on a single plot."
        type: object
        object_type: image
        properties:
          path:
            type: string
          thumbnail_path:
            type: string
          title:
            type: string
        required:
          - path
          - thumbnail_path
          - title
      consensus_peaks_file:
        title: "consesus peak file"
        description: "A set of consensus peaks across samples."
        type: object
        object_type: file
        properties:
          path:
            type: string
          title:
            type: string
          thumbnail_path:
            type: string
        required:
          - path
          - title
      counts_table:
        title: "Project peak coverage file"
        description: "Project peak coverages: chr_start_end X sample"
        type: object
        object_type: file
        properties:
          path:
            type: string
          title:
            type: string
          thumbnail_path:
            type: string
        required:
          - path
          - title
      Time:
        type: string
        description: "Total elapsed pipeline time"
      Success:
        type: string
        description: "Timestamp when pipeline completed successfully"