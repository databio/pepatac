name: pepatac
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12
  - pip
  # Tools the pipeline calls. Versions that can change results are pinned to
  # match the bulker crate (databio/pepatac:1.1.4).
  - bedtools=2.31.1
  - bowtie2=2.5.5
  - fastqc=0.12.1
  - macs3=3.0.3
  - openjdk
  - perl
  - picard=2.27.5
  - pigz
  # preseq 2.0.2: every newer preseq build needs zlib < 1.3, which conflicts
  # with rust-gtars 0.9.0 (the crate has 2.0.3). This old build also keeps
  # R at 4.4.1.
  - preseq=2.0.2
  - rust-gtars=0.9.0
  - samblaster=0.1.26
  - samtools=1.23.1
  - skewer=0.2.2
  - ucsc-bedgraphtobigwig
  - ucsc-bedtobigbed
  - ucsc-bigwigmerge
  # R, plus the packages PEPATACr and tools/*.R use. PEPATACr itself, and
  # pepr and optigrab (not on conda), are installed from R; see
  # docs/run-conda.md.
  - r-base
  - r-argparser
  - r-data.table
  - r-devtools  # checkinstall looks for it
  - r-ggplot2
  - r-gplots
  - r-r.utils
  - r-reshape2
  - r-scales
  - r-yaml
  - bioconductor-genomicranges
  - bioconductor-genomicdistributions
  - bioconductor-genomicdistributionsdata
  # Python packages: the same list as requirements.txt, plus the refgenie CLI.
  - pip:
      - eido>=0.2.4
      - looper>=2.1.1
      - pipestat>=0.13.1
      - ubiquerg>=0.8.1
      - yacman>=1.0.0
      - bio>=0.2.4
      - jinja2
      - logmuse>=0.2.7
      - numpy>=1.21
      - pandas>=1.4
      - pararead>=0.7.0
      - piper>=0.15.2
      - psutil>=5.8
      - pysam>=0.16
      - python-Levenshtein>=0.12
      - pyyaml>=3.13
      - refgenconf>=0.13.1
      - refgenie>=0.13.0,<1.0.0
      - matplotlib>=3.5
      - gtars>=0.9.1
      - pyBigWig>=0.3.18
